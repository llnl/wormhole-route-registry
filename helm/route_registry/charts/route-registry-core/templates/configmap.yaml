apiVersion: v1
kind: ConfigMap
metadata:
  name: route-registry
data:
  # Open Telemetry
  OTEL_SERVICE_NAME: {{ include "route-registry.name" . }}
  OTEL_TRACES_EXPORTER: {{ .Values.config.otel.traces_exporter | quote }}
  OTEL_METRICS_EXPORTER: {{ .Values.config.otel.metrics_exporter | quote }}
  OTEL_LOGS_EXPORTER: {{ .Values.config.otel.logs_exporter | quote }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.otel.otlp_traces_endpoint | quote }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: {{ .Values.config.otel.otlp_metrics_endpoint | quote }}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: {{ .Values.config.otel.otlp_logs_endpoint | quote }}

  DYNACONF_log_level: {{ .Values.config.logLevel | quote }}
  DYNACONF_root_path: {{ .Values.config.rootPath | quote }}

  # Server
  DYNACONF_SERVER__host: {{ .Values.config.server.host | quote }}
  DYNACONF_SERVER__port: {{ .Values.config.server.port | quote }}
  DYNACONF_SERVER__loop: {{ .Values.config.server.loop | quote }}

  # DB
  DYNACONF_DB__url: {{ .Values.config.db.url | quote }}
  DB_SERVICE_NAME: {{ include "route-registry.db-fullname" . | quote }}

  # Celery
  DYNACONF_CELERY__broker_url: {{ .Values.config.celery.broker_url | quote }}
  DYNACONF_CELERY__result_backend: {{ .Values.config.celery.result_backend | quote }}

  DYNACONF_TASKS__max_retries: {{ .Values.config.tasks.max_retries | quote }}
  DYNACONF_TASKS__retry_backoff: {{ .Values.config.tasks.retry_backoff | quote }}

  # URL
  DYNACONF_URL__bind_subdomain: {{ .Values.config.url.bind_subdomain | quote }}
  DYNACONF_URL__holepunch__base_url: {{ .Values.config.url.holepunch.base_url | quote }}
  DYNACONF_URL__holepunch__version: {{ .Values.config.url.holepunch.version | quote }}
  DYNACONF_URL__entry__base_url: {{ .Values.config.url.entry.base_url | quote }}
  DYNACONF_URL__token_service__base_url: {{ .Values.config.url.token_service.base_url | quote }}
  DYNACONF_URL__tunnel__base_url: {{ .Values.config.url.tunnel.base_url | quote }}
  DYNACONF_URL__tunnel__connect_url: {{ .Values.config.url.tunnel.connect_url | quote }}
  DYNACONF_URL__wst__base_url: {{ .Values.config.url.wst.base_url | quote }}
  DYNACONF_URL__pds__base_url: {{ .Values.config.url.pds.base_url | quote }}

  # auth
  DYNACONF_AUTH__auth_name: {{ .Values.config.auth.auth_name | quote }}

  # token service
  DYNACONF_AUTH__token_service__host: {{ .Values.config.auth.token_service.host | quote }}
  DYNACONF_AUTH__token_service__api_version: {{ .Values.config.auth.token_service.api_version | quote }}

  # oidc
  DYNACONF_AUTH__authlib_oidc__url: {{ .Values.config.auth.authlib_oidc.url | quote }}


  {{- with .Values.config.auth.authlib_oidc.session_config }}
  DYNACONF_AUTH__authlib_oidc__session_config__session_cookie: {{ .session_cookie }}
  DYNACONF_AUTH__authlib_oidc__session_config__same_site: {{ .same_site }}
  DYNACONF_AUTH__authlib_oidc__session_config__https_only: {{ .https_only | quote }}
  DYNACONF_AUTH__authlib_oidc__session_config__max_age: {{ .max_age | quote }}

  {{- if .domain }}
  DYNACONF_AUTH__authlib_oidc__session_config__domain: {{ .domain | quote }}
  {{- end }}

  {{- end }}


  DYNACONF_AUTH__authlib_oidc__strategy_name: {{ .Values.config.auth.authlib_oidc.strategy_name | quote }}
  DYNACONF_AUTH__authlib_oidc__discovery_url: {{ .Values.config.auth.authlib_oidc.discovery_url | quote }}
  DYNACONF_AUTH__authlib_oidc__redirect_uri: {{ .Values.config.auth.authlib_oidc.redirect_uri | quote }}

  # jwt
  DYNACONF_AUTH__jwt__lifespan: {{ .Values.config.auth.jwt.lifespan | quote }}
  DYNACONF_AUTH__jwt__active_kid: {{ .Values.config.auth.jwt.active_kid | quote }}
