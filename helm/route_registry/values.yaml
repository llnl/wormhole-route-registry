# Default values for route-registry.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

route-registry-core:
  image:
    repository: llnl/route-registry
    tag: "0.1.0"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP
    port: 5001
    name: route-registry-core
  ingress:
    annotations: {}
    enabled: true
    hosts: []
    tls: []
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  volumes:
    name: results-db
    mountPath: /data
  config:
    server:
      host: "0.0.0.0"
      port: 5001
      loop: "asyncio"
    db:
      url: "sqlite:///test.db"
    auth:
      auth_name: "authlib_oidc"
      authlib_oidc:
        url: "http://your-domain.com/route-registry"
        discovery_url: "https://your-auth-provider.com/.well-known/openid-configuration"
        session_config:
          session_cookie: "route-registry-session"
          same_site: "strict"
          https_only: True
          max_age: 43200
        strategy_name: "GenericOAuth"
        redirect_uri: "/auth/callback"
      jwt:
        lifespan: 2592000
        active_kid: "1"
      token_service:
        host: "http://token-service:8080"
        api_version: "v1"
    otel:
      # traces, metrics, and logs exporters are a comma separated list e.g. console,otlp
      traces_exporter: "console"
      metrics_exporter: "console"
      logs_exporter: "console"
      otlp_traces_endpoint: ""
      otlp_metrics_endpoint: ""
      otlp_logs_endpoint: ""
    logLevel: "INFO"
    rootPath: "/route-registry"
    celery:
      broker_url: "amqp://rabbit:password@route-registry-rabbitmq:5672//"
      result_backend: "db+sqlite:////data/results.db"
    tasks:
      max_retries: 5
      retry_backoff: 30
    url:
      bind_subdomain: false
      holepunch:
        base_url: http://holepunch-admin:8082/api
        version: v1
      token_service:
        base_url: http://token-service:8080
      entry:
        base_url: http://localhost/wormhole
      tunnel:
        base_url: http://piko:8000
        connect_url: http://localhost:8000
      wst:
        base_url: http://localhost/wormhole
      pds:
        base_url: http://localhost/wormhole
  postgres:
    userKey: POSTGRESQL_USER
    passwordKey: POSTGRESQL_PASSWORD


route-registry-worker:
  image:
    repository: llnl/route-registry-celery
    tag: "0.15.3"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP
    port: 5672
    name: route-registry-worker
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  volumes:
    name: results-db
    mountPath: /data

rabbitmq:
  image:
    repository: rabbitmq
    tag: "3.8"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP
    port: 5672
    name: rabbitmq
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  volumes:
      name: rabbitmq-data
      accessMode: ReadWriteOnce
      volumeCapacity: 8Gi
      mountPath: /var/lib/rabbitmq/mnesia


postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP
    port: 5432
    name: postgres
    annotations: {}
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  volumes:
      name: postgres-data
      accessMode: ReadWriteOnce
      volumeCapacity: 8Gi
      mountPath: /var/lib/pgsql/data
      pgdata: /var/lib/pgsql/data
  cert:
    enabled: false
    name: my-postgres-tls
    mountPath: /opt/app-root/src/certs



global:
  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Automatically mount a ServiceAccount's API credentials?
    automount: false
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

    podAnnotations: {}
    podLabels: {}

    podSecurityContext: {}
    # fsGroup: 2000

    securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

    resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

    livenessProbe:
    httpGet:
      path: /
      port: http
    readinessProbe:
    httpGet:
      path: /
      port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

    # Additional volumeMounts on the output Deployment definition.
    volumeMounts: []
    # - name: foo
    #   mountPath: "/etc/foo"
    #   readOnly: true

    nodeSelector: {}

    tolerations: []

    affinity: {}
