name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # uv's cache would only hold tox, since tox installs ruff with pip.
          # Saving it gains little, and copying the test job's cache settings
          # here would make the two jobs share a cache key
          enable-cache: false

      - name: Check lint and formatting
        run: uvx tox -e lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      rabbitmq:
        image: rabbitmq:4.2.8
        # The default guest user may only connect from inside the container
        env:
          RABBITMQ_DEFAULT_USER: wormhole
          RABBITMQ_DEFAULT_PASS: wormhole
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        env:
          DYNACONF_RABBITMQ__username: wormhole
          DYNACONF_RABBITMQ__password: wormhole
        run: uv run pytest -rs
