apiVersion: v1
kind: Service
metadata:
  name: {{ include "route-registry.fullname" . }}
  labels:
    {{- include "route-registry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: route-registry
  selector:
    {{- include "route-registry.selectorLabels" . | nindent 4 }}
